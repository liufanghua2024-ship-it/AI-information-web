name: Daily healthcare intelligence
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: Backfill the last three months in weekly search windows
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: healthcare-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect and build
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          args=()
          if [ "$BACKFILL" = "true" ]; then args+=(--backfill); fi
          python scripts/publish_site.py --collect "${args[@]}" --previous-url "https://${{ github.repository_owner }}.github.io/AI-information-web/data.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .local/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
